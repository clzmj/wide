[package]
name = "wide"
version = "0.1.9"
edition = "2021"
rust-version = "1.85"
description = "A simple macOS terminal form for Samsung ultrawide monitor layouts"
license = "MIT"
repository = "https://github.com/clzmj/wide"
homepage = "https://wide.clzmj.dev"

[features]
experimental-writes = []

[dependencies]
dialoguer = { version = "0.12", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
